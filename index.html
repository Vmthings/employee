<script>
/* Company code: encrypts everything stored on the shared relay and picks its private folder.
   Change it to your own secret BEFORE sharing the site, and never change it afterwards (that starts a new empty chat). */
const COMPANY_CODE='H4CK13B3RRY';
const K='hrs_chat_v2',root=document.getElementById('root'),now=()=>Date.now();
const bump=r=>{r.m=Math.max(now(),(r.m||0)+1);return r};
let db=load(),me=null,v={t:'home',tab:'all',ch:'general',peer:null,note:null,modal:null,ctx:null};
try{me=localStorage.getItem('hrs_me')}catch(e){}
function norm(d){
  for(const s of ['users','roles','ch','fr','msgs'])d[s]=(d[s]&&typeof d[s]==='object')?d[s]:{};
  d.roles.employee=d.roles.employee||{id:'employee',name:'Employee',color:'#5865f2',m:1};
  d.ch.general=d.ch.general||{id:'general',name:'general',o:1,m:1};
  d.ch.announcements=d.ch.announcements||{id:'announcements',name:'announcements',a:1,o:2,m:1};
  return d}
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d)return norm(d)}catch(e){}return norm({})}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}

/* ---------- helpers ---------- */
let SINCE=Date.now(),BURST=0;
const ADMIN='vmthings',isAdmin=()=>me===ADMIN;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cleanO=a=>a.filter(z=>Number.isInteger(z)&&z>=0&&z<10).slice(0,10);
const okId=s=>typeof s==='string'&&/^[\w.|:-]{1,70}$/.test(s)&&!/^(__proto__|constructor|prototype)$/.test(s);
const col=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#5865f2';
const safePic=p=>typeof p==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)?p:null;
const hx=a=>Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hx(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:150000},k,256)));
}
const getU=n=>{const u=db.users[n];return u&&!u.del&&u.h?u:null};
const users=()=>Object.keys(db.users).filter(getU).sort();
const U=()=>db.users[me];
const OWNER={name:'Owner',color:'#f0b232'};

  const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(COMPANY_CODE),'PBKDF2',false,['deriveKey']);
  MQ.key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('hrs-chat-key-v1'),iterations:100000},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  MQ.ns='hrs/'+hx(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('ns:'+COMPANY_CODE)))).slice(0,24);
  for(const url of BROKERS){
    const c=mqtt.connect(url,{clientId:'hrs_'+newId(),clean:true,reconnectPeriod:4000,connectTimeout:10000,keepalive:30});
    c.on('connect',()=>{BURST=Date.now()+6000;c.subscribe(['users','roles','ch','fr','msg'].map(x=>MQ.ns+'/'+x+'/#').concat(MQ.ns+'/typing/ch/+'),{qos:1});mqSubDM(c);Object.keys(MQ.want).forEach(id=>c.subscribe(`${MQ.ns}/blob/${id}/+`,{qos:1}));status();clearTimeout(MQ.rt);MQ.rt=setTimeout(()=>{MQ.ready=true;mqSync();MQ.pend.splice(0).forEach(([id,k])=>mqPubBlob(id,k));status()},2500)});
    c.on('message',async(t,buf)=>{try{
      const p=t.split('/');
      if(p[2]==='blob'){
        const id=p[3],w=MQ.want[id];if(!w||!buf||!buf.length)return;
        const u=await mqDecB(new Uint8Array(buf),w.k.startsWith('dm:')?await dmKey(w.k.slice(3)):MQ.key);
        const i=(u[0]<<8)|u[1],n=(u[2]<<8)|u[3];if(!n||n>200||i>=n)return;
        const e=MQ.parts[id]=MQ.parts[id]||{n,got:{}};e.got[i]=u.slice(4);
        if(Object.keys(e.got).length===e.n){const parts=[];for(let j=0;j<e.n;j++)parts.push(e.got[j]);await putBlob(id,new Blob(parts,{type:w.type}));delete MQ.want[id];delete MQ.parts[id];c.unsubscribe(`${MQ.ns}/blob/${id}/+`);renderSoon()}
        return;
      }
      const txt=new TextDecoder().decode(buf);
      if(p[2]==='typing'){
        let room,key;
        if(p[3]==='ch'&&p[4]){room='ch:'+p[4];key=MQ.key}
        else if(p[3]==='dm'&&p[4]&&p[5]&&me&&(p[4]===me||p[5]===me)){const pair=[p[4],p[5]].sort().join('|');room='dm:'+pair;key=await dmKey(pair)}
        else return;
        const o=await mqDec(txt,key);if(o&&typeof o.u==='string')typSet(room,o.u);return;
      }
      if(p[2]==='dm'){if(!me||!p[3]||!p[4]||(p[3]!==me&&p[4]!==me))return;const pair=[p[3],p[4]].sort().join('|');mqIn(await mqDec(txt,await dmKey(pair)),pair)}
      else mqIn(await mqDec(txt));
    }catch(e){}});
    c.on('close',status);c.on('error',()=>{});
    MQ.cl.push(c);
  }
}

function signOut(){endCall();me=null;stopSelf();try{localStorage.removeItem('hrs_me')}catch(e){}v.modal=null;v.ctx=null;render()}
async function signIn(name,pw){
  name=name.trim().toLowerCase();
  if(!/^[a-z0-9._-]{2,20}$/.test(name))return 'Use 2–20 letters, numbers, dots, dashes or underscores for the username.';
  if(pw.length<4)return 'Password must be at least 4 characters.';
  if(!window.crypto||!crypto.subtle)return 'Passwords need a secure (https) page. Open the site over https.';
  const u=getU(name);
  if(u){if(await hash(pw,u.s)!==u.h)return 'Wrong username or password.'}
  else{
    if(!MQ.ready&&!['host','online','offline'].includes(NET.st))return 'Still connecting to the chat network. Wait a few seconds and try again.';
    const s=hx(crypto.getRandomValues(new Uint8Array(8))),old=db.users[name];db.users[name]={h:await hash(pw,s),s,roles:[],m:Math.max(now(),(old?old.m:0)+1)};changed();
  }
  me=name;SINCE=now();try{localStorage.setItem('hrs_me',me)}catch(e){}
  v={t:'home',tab:'all',ch:'general',peer:null,note:null,modal:null,ctx:null};
  rdLoad();startSelf();mqSubAll();setTimeout(mqSync,2500);render();return '';
}
function addFriend(raw){
  const n=raw.trim().toLowerCase().replace(/^@/,'');
  if(!n)return v.note=['er','Enter a username.'];
  if(n===me)return v.note=['er','You can’t add yourself.'];
  if(!getU(n))return v.note=['er','No employee “'+n+'” has an account yet.'];
  if(friendsOf(me).includes(n))return v.note=['er','You’re already friends with '+n+'.'];
  if(incOf(me).includes(n)){accept(n);return v.note=['ok','You and '+n+' are now friends.']}
  if(outOf(me).includes(n))return v.note=['er','Request to '+n+' is already pending.'];
  const [a,b]=[me,n].sort(),old=db.fr[a+'|'+b];db.fr[a+'|'+b]={a,b,from:me,st:'req',gen:(old&&old.gen||0)+1,m:Math.max(now(),(old?old.m:0)+1)};changed();
  v.note=['ok','Request sent to '+n+'. They’ll see it the next time they’re online.'];
}
function accept(n){const f=db.fr[fk(me,n)];if(!f)return;f.st='ok';f.keep=Math.random()<.5?me:n;bump(f);changed()}
function dropEdge(n){const f=db.fr[fk(me,n)];if(!f)return;f.del=1;bump(f);changed()}
const slowSecs=c=>Math.min(86400,Math.max(0,Number(c&&c.slow)||0));
const slowExempt=c=>can('bypass')||inList(c&&c.slowx,me);
function slowLeft(c){
  const sl=slowSecs(c);if(!sl||slowExempt(c))return 0;
  const l=msgsOf('official:'+c.id).filter(m=>m.u===me).pop();
  return l?Math.max(0,Math.ceil((l.t+sl*1000-now())/1000)):0;
}
const fmtSlow=s=>s>=3600?s/3600+'h':s>=60?s/60+'m':s+'s';
function slowText(c){
  const sl=slowSecs(c);if(!sl||!me||slowExempt(c))return '';
  const l=slowLeft(c);return l?'Slowmode: you can send again in '+l+'s':'Slowmode is on: one message every '+fmtSlow(sl);
}
function send(text){
  text=text.trim();if(!text||v.t==='home')return false;
  if(v.t==='server'){const c=chan(v.ch);if(!c||!canPost(c)||slowLeft(c)>0)return false}
  const k=key(),rec={id:newId(),u:me,t:now(),m:now(),x:text.slice(0,2000)};if(v.reply&&v.reply.k===k)rec.re=v.reply.id;v.reply=null;typSent=0;(db.msgs[k]=db.msgs[k]||[]).push(rec);changed();return true;
}
function fmt(ts){
  const d=new Date(ts),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return d.toDateString()===new Date().toDateString()?'Today at '+t:d.toLocaleDateString()+' '+t;
}

/* ---------- Discord-style markdown + link embeds ---------- */
const link=(u,t)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer nofollow">${esc(t)}</a>`;
function md(src,author){
  const K=[],H=h=>'\u0000'+(K.push(h)-1)+'\u0000';
  let t=String(src).replace(/\u0000/g,'');
  t=t.replace(/```(?:[\w+-]{1,20}\n)?([\s\S]*?)```/g,(m,c)=>H(`<pre class="cb"><code>${esc(c.replace(/^\n+|\n+$/g,''))}</code></pre>`));
  t=t.replace(/``([^`]+)``|`([^`\n]+)`/g,(m,a,b)=>H(`<code class="ic">${esc((a||b).trim())}</code>`));
  t=t.replace(/\[([^\]\n]{1,100})\]\((https?:\/\/[^\s)]{1,500})\)/g,(m,x,u)=>H(link(u,x)));
  t=t.replace(/<(https?:\/\/[^\s>]{1,500})>|(https?:\/\/[^\s<]{1,500}[^\s<.,;:!?)\]'"])/g,(m,a,b)=>{const u=a||b;return H(link(u,u))});
  t=t.replace(/\\([\\*_~|`>#\[\]()-])/g,(m,c)=>H(esc(c)));
  t=t.replace(/(^|[\s(])@([a-z0-9._-]{2,20})(?![\w.-])/g,(m,p,n)=>(getU(n)||(n==='everyone'&&author&&can('pingall',author)))?p+H(`<span class="mention">@${esc(n)}</span>`):m);
  t=esc(t);
  const inl=x=>x
    .replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<u>$1</u>')
    .replace(/~~(.+?)~~/g,'<s>$1</s>')
    .replace(/\|\|(.+?)\|\|/g,'<span class="spoiler" data-a="spoil" tabindex="0" role="button">$1</span>')
    .replace(/\*(?!\s)(.+?)\*/g,'<i>$1</i>')
    .replace(/(^|[^\w])_(?!\s)(.+?)_(?!\w)/g,'$1<i>$2</i>');
  const L=t.split('\n'),out=[];let plain=false,m;
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^&gt;&gt;&gt; /.test(l)){out.push(`<blockquote>${L.slice(i).map((x,j)=>inl(j?x:x.replace(/^&gt;&gt;&gt; /,''))).join('<br>')}</blockquote>`);plain=false;break}
    if(/^&gt; /.test(l)){const q=[];while(i<L.length&&/^&gt; /.test(L[i]))q.push(inl(L[i++].replace(/^&gt; /,'')));i--;out.push(`<blockquote>${q.join('<br>')}</blockquote>`);plain=false;continue}
    if(m=l.match(/^(#{1,3}) (.+)$/)){out.push(`<div class="mh h${m[1].length}">${inl(m[2])}</div>`);plain=false;continue}
    if(m=l.match(/^-# (.+)$/)){out.push(`<div class="msub">${inl(m[1])}</div>`);plain=false;continue}
    if(/^[-*] /.test(l)){const q=[];while(i<L.length&&/^[-*] /.test(L[i]))q.push(`<li>${inl(L[i++].slice(2))}</li>`);i--;out.push(`<ul>${q.join('')}</ul>`);plain=false;continue}
    if(/^\d{1,3}\. /.test(l)){const st=parseInt(l),q=[];while(i<L.length&&/^\d{1,3}\. /.test(L[i]))q.push(`<li>${inl(L[i++].replace(/^\d{1,3}\. /,''))}</li>`);i--;out.push(`<ol start="${st}">${q.join('')}</ol>`);plain=false;continue}
    out.push((plain?'<br>':'')+inl(l));plain=true;
  }
  return out.join('').replace(/\u0000(\d+)\u0000/g,(m,n)=>K[+n]);
}
function embedsOf(x){
  const t=x.replace(/```[\s\S]*?```/g,' ').replace(/`[^`\n]*`/g,' ').replace(/<https?:\/\/[^\s>]+>/g,' ');
  const seen=new Set(),out=[];
  for(const mt of t.matchAll(/https?:\/\/[^\s<]{1,500}[^\s<.,;:!?)\]'"]/g)){
    const u=mt[0];if(seen.has(u)||out.length>=3)continue;seen.add(u);
    let url;try{url=new URL(u)}catch(e){continue}
    const h=url.hostname.replace(/^www\./,''),path=url.pathname,eu=esc(u);
    let yt=null;
    if(h==='youtu.be')yt=path.slice(1,12);
    else if(/^(m\.|music\.)?youtube\.com$/.test(h))yt=url.searchParams.get('v')||(path.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)||[])[1];
    if(yt&&/^[\w-]{11}$/.test(yt))out.push(`<iframe class="emb-yt" src="https://www.youtube-nocookie.com/embed/${yt}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation" title="YouTube video"></iframe>`);
    else if(/\.(png|jpe?g|gif|webp|avif)$/i.test(path))out.push(`<a href="${eu}" target="_blank" rel="noopener noreferrer nofollow"><img class="emb-img" loading="lazy" referrerpolicy="no-referrer" src="${eu}" alt=""></a>`);
    else if(/\.(mp4|webm|mov|m4v|ogv)$/i.test(path))out.push(`<video class="vid" controls preload="metadata" playsinline src="${eu}"></video>`);
    else out.push(`<a class="emb-card" href="${eu}" target="_blank" rel="noopener noreferrer nofollow"><div class="h">${esc(h)}</div><div class="u">${eu}</div></a>`);
  }
  return out.join('');
}

    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
    b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b&&b.size<=600*1024)return b;

const CALL={st:'idle',peer:null,call:null,pend:[],inc:null,stream:null,screen:null,screenCall:null,muted:false,t0:0,tm:null};

  let stream;try{stream=await navigator.mediaDevices.getUserMedia(micOpts)}catch(e){return notice('Microphone blocked','Allow microphone access in your browser to make a call.')}

}

const cname=s=>{const t=Array.from(s.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_\-\p{Extended_Pictographic}\u200d\ufe0f\u20e3\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}]/gu,'')).slice(0,24).join('');return /[a-z0-9\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}]/u.test(t)?t:''};
function uniq(n){const b=n,all=chans().map(c=>c.name);let i=2;while(all.includes(n))n=b+'-'+i++;return n}

async function dupChan(id){
  if(!can('chan'))return;const c=chan(id);if(!c)return;const nid=newId(),t=now(),L=[];
  for(const m of msgsOf('official:'+id)){const n={...m,id:newId(),m:t};if(m.v){n.v=newId();try{const b=await getBlob(m.v);if(b){await putBlob(n.v,b);uploadVid(n.v,b);mqPubBlob(n.v,'official:'+nid)}}catch(e){}}L.push(n)}
  db.ch[nid]={id:nid,name:uniq(c.name+'-copy'),a:c.a,vis:c.vis,post:c.post,slow:c.slow,slowx:c.slowx,nohist:c.nohist,o:t,m:t};db.msgs['official:'+nid]=L;v.ch=nid;v.t='server';changed();render();

async function sendVideo(f){
  if(!can('video')||v.t!=='server')return;
  if(!f.type.startsWith('video/'))return notice('Can’t send this file','Choose a video file.');
  if(f.size>12*1024*1024)return notice('Video is too large','Videos are shared through the chat in small pieces, so they must be under 12 MB. Short clips work best.');
  const id=newId(),cap=document.getElementById('msgin');
  try{await putBlob(id,f)}catch(e){return notice('Video not saved','The video couldn’t be saved. Storage on this device may be full.')}
  (db.msgs[key()]=db.msgs[key()]||[]).push({id:newId(),u:me,t:now(),m:now(),x:cap?cap.value.trim().slice(0,2000):'',v:id,vt:f.type,bn:Math.max(1,Math.ceil(f.size/CH))});
  if(cap)cap.value='';vurl[id]=URL.createObjectURL(f);changed();uploadVid(id,f);mqPubBlob(id,key());render();
}
async function delAccount(){
  const n=document.getElementById('delname').value.trim().toLowerCase(),p=document.getElementById('delpw').value,er=document.getElementById('derr'),u=getU(me);
  let ok=false;try{ok=n===me&&p&&await hash(p,u.s)===u.h}catch(e){}
  if(!ok){er.textContent='That username and password don’t match this account.';return}
  const t=now(),gone=[];
  for(const k of Object.keys(db.msgs)){
    if(k.startsWith('dm:')&&k.slice(3).split('|').includes(me)){db.msgs[k].forEach(m=>m.v&&gone.push(m.v));delete db.msgs[k]}
    else for(const m of db.msgs[k])if(m.u===me&&!m.del){if(m.v)gone.push(m.v);tomb(m)}
  }
  for(const f of Object.values(db.fr))if(!f.del&&(f.a===me||f.b===me)){f.del=1;f.m=t}
  db.users[me]={del:1,m:Math.max(t,(db.users[me].m||0)+1)};save();push();v.modal=null;signOut();
  gone.forEach(id=>delBlob(id).catch(()=>{}));
}

  else if(id==='medit'){e.preventDefault();document.querySelector('[data-a=mesave]').click()}
  else if(id==='chn'){e.preventDefault();document.querySelector('[data-a=chgo]').click()}
  else if(id==='rname'){e.preventDefault();document.querySelector('[data-a=rnew]').click()}
  else if(id==='msgin'){if(matchMedia('(hover:none)').matches)return;e.preventDefault();if(send(e.target.value))e.target.value='';render()}
  else if(id==='friendin'){e.preventDefault();addFriend(e.target.value);render()}
});

/* ---------- start ---------- */
if(me&&!getU(me))me=null;
if(me)rdLoad();
render();
if(window.Peer){join();if(me)startSelf()}else{NET.st='offline';status()}
mqInit().catch(()=>{});
setTimeout(()=>{if(NET.st==='connecting'&&!MQ.cl.some(c=>c.connected)){NET.st='offline';status()}},12000);
setInterval(dmTick,6000);
setInterval(typUpdate,1000);
setInterval(()=>{const el=document.getElementById('slowbar');if(el&&me&&v.t==='server'){const c=chan(v.ch);if(c)el.textContent=slowText(c)}},1000);
const wake=()=>{
  if(document.visibilityState==='hidden'||!window.Peer)return;
  if(NET.host){if(!NET.hp||NET.hp.destroyed)join();else if(NET.hp.disconnected)try{NET.hp.reconnect()}catch(e){}}
  else if(!(NET.hub&&NET.hub.open))join();
  if(me){if(!NET.sp||NET.sp.destroyed)startSelf();else if(NET.sp.disconnected)try{NET.sp.reconnect()}catch(e){}}
};
document.addEventListener('visibilitychange',()=>{wake();if(document.visibilityState==='visible'&&me)render()});window.addEventListener('online',wake);window.addEventListener('pageshow',wake);window.addEventListener('focus',()=>{if(me)render()});
window.addEventListener('beforeunload',()=>{try{NET.hp&&NET.hp.destroy();NET.sp&&NET.sp.destroy()}catch(e){}});
</script>
