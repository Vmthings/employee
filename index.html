<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Device-Stored Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eceff1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 420px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; height: 550px; overflow: hidden; }
        #setup-panel { padding: 15px; background: #37474f; color: white; font-size: 14px; border-bottom: 2px solid #263238; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        .msg { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-wrap: break-word; }
        .msg.host { background: #e3f2fd; align-self: flex-start; margin-right: auto; }
        .msg.guest { background: #e8f5e9; align-self: flex-end; margin-left: auto; }
        .meta { font-size: 11px; color: #78909c; display: block; margin-bottom: 2px; }
        #input-container { display: flex; padding: 12px; background: #ffffff; border-top: 1px solid #cfd8dc; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #b0bec5; border-radius: 6px; outline: none; }
        #send-btn { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; }
    </style>
    <!-- Import PeerJS Library -->
    <script src="https://unpkg.com"></script>
</head>
<body>

<div id="chat-container">
    <div id="setup-panel">
        <div id="host-section">
            <strong>Your ID:</strong> <span id="my-id" style="color: #ffeb3b; font-weight: bold;">Connecting to broker server...</span>
        </div>
        <div id="guest-section" style="margin-top: 8px;">
            <input type="text" id="peer-id-input" placeholder="Paste Friend's ID here..." style="padding: 4px; width: 200px;">
            <button id="connect-btn" style="padding: 4px 8px;">Connect</button>
        </div>
        <div id="status" style="margin-top: 8px; color: #b2dfdb; font-size: 12px;">Status: Initialising network pipeline...</div>
    </div>
    
    <div id="messages" style="display: flex; flex-direction: column;"></div>
    
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>
</div>

<script>
    // Explicitly configure PeerJS cloud variables to bypass HTTPS blockages
    const peer = new Peer(undefined, {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        path: '/'
    });

    let conn = null;
    let isHost = true;

    const myIdDisplay = document.getElementById('my-id');
    const peerIdInput = document.getElementById('peer-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const statusDisplay = document.getElementById('status');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // 1. Success Listener: Cloud broker generates your identity
    peer.on('open', (id) => {
        myIdDisplay.style.color = '#fff';
        myIdDisplay.textContent = id;
        statusDisplay.textContent = "Status: Online. Ready for direct incoming peer connections.";
    });

    // 2. Error Diagnostic Listener: Detects why it failed
    peer.on('error', (err) => {
        console.error("PeerJS Core Error:", err);
        myIdDisplay.style.color = '#ff8a80';
        myIdDisplay.textContent = "Connection Failure";
        statusDisplay.innerHTML = `<span style="color: #ff8a80;">Error [${err.type}]: ${err.message}</span>`;
    });

    // 3. HOST MODE: A remote peer pipes down your handshake connection
    peer.on('connection', (connection) => {
        conn = connection;
        isHost = true;
        setupChatSystem();
    });

    // 4. GUEST MODE: Actively target and bind to a remote peer's ID
    connectBtn.addEventListener('click', () => {
        const targetId = peerIdInput.value.trim();
        if (targetId) {
            statusDisplay.textContent = "Status: Directing handshake request to target peer hardware...";
            conn = peer.connect(targetId);
            isHost = false;
            setupChatSystem();
        }
    });

    // 5. Establish real-time data frame listener bindings
    function setupChatSystem() {
        conn.on('open', () => {
            statusDisplay.textContent = `Status: Direct network link verified. Connected as ${isHost ? 'Host' : 'Guest'}.`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
        });

        // Pull message frames directly out of your network interface card (RAM-to-RAM)
        conn.on('data', (data) => {
            appendMessage(data.sender, data.text, data.sender === 'Host' ? 'host' : 'guest');
        });

        conn.on('close', () => {
            statusDisplay.textContent = "Status: Direct network socket closed. Peer disconnected.";
            messageInput.disabled = true;
            sendBtn.disabled = true;
        });
    }

    // 6. Push strings into the active peer's data channel
    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && conn) {
            const senderLabel = isHost ? 'Host' : 'Guest';
            const payload = { sender: senderLabel, text: text };
            
            conn.send(payload);
            appendMessage(senderLabel, text, isHost ? 'host' : 'guest');
            messageInput.value = '';
        }
    }

    function appendMessage(sender, text, typeClass) {
        const msgEl = document.createElement('div');
        msgEl.className = `msg ${typeClass}`;
        msgEl.innerHTML = `<span class="meta">${sender}</span>${text}`;
        messagesDiv.appendChild(msgEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
