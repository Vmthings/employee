<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 "gg sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #00a8fc;outline-offset:2px}
.logo{font-family:Montserrat,"Segoe UI",sans-serif;font-weight:700;letter-spacing:-.04em;line-height:1;color:#000;background:#fff;display:flex;align-items:center;justify-content:center;user-select:none}

.phead{display:flex;gap:16px;align-items:center;margin-bottom:8px;padding-right:24px}

.row .nm.tap:hover{text-decoration:underline}

.nst[data-s=host]::before,.nst[data-s=online]::before{background:var(--green)}
.nst[data-s=connecting]::before{background:#f0b232}
.rail .nst{margin-top:auto;padding:0 4px}.rail .nst::before{display:block;margin:0 auto 3px}
.nav{display:flex;flex:none}
.burger,.scrim{display:none}
.mhead{overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.composer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(hover:none){.del{display:flex;position:static;margin-left:auto;align-self:flex-start;flex:none}.msg .gut{display:none}}
@media(max-width:760px){
.nav{position:fixed;inset:0 auto 0 0;z-index:8;width:min(88vw,340px);transform:translateX(-100%);transition:transform .2s}
.nav.open{transform:none;box-shadow:0 0 24px rgba(0,0,0,.5)}

.nav.open+.scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:7}
.burger{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-8px;font-size:22px;color:var(--muted);flex:none;border-radius:4px}
.members{display:none}
.pane{padding:12px}
.msg{padding-left:12px;padding-right:12px}
.mhead{padding:0 12px}
input{font-size:16px}
.btn{padding:10px 14px}
.row{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){.nav{transition:none}}
.mbox .sub{display:block;font-size:12px;color:var(--muted);margin:6px 0}
.rr{border-top:1px solid #3f4147;padding:10px 0}
.slowbar{font-size:12px;color:var(--muted);padding:0 4px 6px}.slowbar:empty{display:none}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* Company code: encrypts everything stored on the shared relay and picks its private folder.
   Change it to your own secret BEFORE sharing the site, and never change it afterwards (that starts a new empty chat). */
const COMPANY_CODE='H4CK13B3RRY';
const K='hrs_chat_v2',root=document.getElementById('root'),now=()=>Date.now();
let db=load(),me=null,v={t:'home',tab:'all',ch:'general',peer:null,note:null,modal:null,ctx:null};
try{me=localStorage.getItem('hrs_me')}catch(e){}
function norm(d){
  for(const s of ['users','roles','ch','fr','msgs'])d[s]=(d[s]&&typeof d[s]==='object')?d[s]:{};
  d.roles.employee=d.roles.employee||{id:'employee',name:'Employee',color:'#5865f2',m:1};
  d.ch.general=d.ch.general||{id:'general',name:'general',o:1,m:1};
  d.ch.announcements=d.ch.announcements||{id:'announcements',name:'announcements',a:1,o:2,m:1};
  return d}
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d)return norm(d)}catch(e){}return norm({})}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}

/* ---------- helpers ---------- */
let SINCE=Date.now();
const ADMIN='vmthings',isAdmin=()=>me===ADMIN;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const okId=s=>typeof s==='string'&&/^[\w.|:-]{1,70}$/.test(s)&&!/^(__proto__|constructor|prototype)$/.test(s);
const col=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#5865f2';
const safePic=p=>typeof p==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)?p:null;
const hx=a=>Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hx(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:150000},k,256)));
}
const getU=n=>{const u=db.users[n];return u&&!u.del&&u.h?u:null};
const users=()=>Object.keys(db.users).filter(getU).sort();
const U=()=>db.users[me];
const OWNER={name:'Owner',color:'#f0b232'};
const roleList=()=>Object.keys(db.roles).filter(id=>!db.roles[id].del).map(id=>({...db.roles[id],id}));
const PERMS=[['video','Send videos'],['announce','Post announcements'],['delmsg','Delete messages'],['chan','Manage channels'],['assign','Assign roles'],['bypass','Bypass slowmode'],['nohistory','Can’t view chat history',1]];
const SLOWS=[[0,'Off'],[5,'5s'],[10,'10s'],[30,'30s'],[60,'1m'],[300,'5m'],[900,'15m'],[3600,'1h']];
function roleIds(n){const u=getU(n)||{},ids=(Array.isArray(u.roles)?u.roles:[]).filter(id=>db.roles[id]&&!db.roles[id].del);return ids.length||n===ADMIN?ids:(db.roles.employee&&!db.roles.employee.del?['employee']:[])}
function rolesOf(n){const r=n===ADMIN?[OWNER]:[];roleIds(n).forEach(id=>r.push(db.roles[id]));return r}
const hasP=(p,n=me)=>roleIds(n).some(id=>db.roles[id].p&&db.roles[id].p[p]===true);
const can=(p,n=me)=>n===ADMIN||hasP(p,n);
const inList=(l,n)=>Array.isArray(l)&&l.length&&roleIds(n).some(id=>l.includes(id));
const canSee=(c,n=me)=>n===ADMIN||!Array.isArray(c.vis)||!c.vis.length||inList(c.vis,n);
const canPost=(c,n=me)=>canSee(c,n)&&(!c.a||can('announce',n))&&(n===ADMIN||!Array.isArray(c.post)||!c.post.length||inList(c.post,n));
const rc=n=>{const r=rolesOf(n)[0];return r?col(r.color):'#fff'};
const chans=()=>Object.keys(db.ch).filter(id=>!db.ch[id].del).map(id=>({...db.ch[id],id})).sort((a,b)=>a.o-b.o);
const chan=id=>{const c=db.ch[id];return c&&!c.del?{...c,id}:null};
const fk=(a,b)=>[a,b].sort().join('|');
const edges=n=>Object.values(db.fr).filter(f=>!f.del&&(f.a===n||f.b===n));
const oth=(f,n)=>f.a===n?f.b:f.a;
const friendsOf=n=>edges(n).filter(f=>f.st==='ok').map(f=>oth(f,n));
const incOf=n=>edges(n).filter(f=>f.st==='req'&&f.from!==n).map(f=>f.from);
const outOf=n=>edges(n).filter(f=>f.st==='req'&&f.from===n).map(f=>oth(f,n));
const av=(n,c,big)=>{const p=safePic((db.users[n]||{}).pic);return `<div class="av${big?' big':''}${c?' tap':''}"${c?` data-a="prof" data-n="${esc(n)}"`:''} style="${p?`background:url(${p}) center/cover`:`background:hsl(${hue(n)} 55% 45%)`}">${p?'':esc(n[0]||'?')}</div>`};
const nameTag=n=>`<span class="who tap" data-a="prof" data-n="${esc(n)}" style="color:${rc(n)}">${esc(n)}</span>`;
const key=()=>v.t==='server'?'official:'+v.ch:'dm:'+fk(me,v.peer);
const msgsOf=k=>(db.msgs[k]||[]).filter(m=>!m.del);
const BURGER='<button class="burger" data-a="nav" aria-label="Open menu">☰</button>';
const tomb=m=>{m.del=1;m.m=now();m.x='';delete m.v;delete m.vt;delete m.ed};

/* ---------- video storage (IndexedDB) ---------- */
let _idb;const idb=()=>_idb||(_idb=new Promise((res,rej)=>{const r=indexedDB.open('hrs_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f',m),o=f(t.objectStore('f'));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)})};
const putBlob=(k,b)=>tx('readwrite',x=>x.put(b,k)),getBlob=k=>tx('readonly',x=>x.get(k)),delBlob=k=>tx('readwrite',x=>x.delete(k));
const vurl={};let asked={},missing={};

/* ---------- peer-to-peer network ---------- */
const HUB='hrs2-hub-v1',NET={st:'connecting',host:false,hub:null,hp:null,np:null,sp:null,spErr:false,clients:new Set(),last:0};
const dmc={};let joinT,pushTm,rT;
function status(){
  const relay=typeof MQ!=='undefined'&&MQ.cl.some(c=>c.connected),st=NET.st!=='host'&&relay?'online':NET.st;
  const t={connecting:'Connecting',host:'Host'+(NET.clients.size?' · '+NET.clients.size:''),online:'Live',offline:'Offline'}[st];
  const tip={connecting:'Connecting to the chat network…',host:'This device is the randomly chosen host for the Official server',online:'Connected. Messages and accounts are shared across all devices.',offline:'No connection. Changes sync when you’re back online.'}[st]+(NET.spErr?' Direct messages are paused because this account is open on too many devices.':'');
  document.querySelectorAll('.nst').forEach(e=>{e.dataset.s=st;e.textContent=t;e.title=tip});
  const h=document.getElementById('lhint');if(h)h.textContent=st==='offline'?'Can’t reach the chat network from here. You can still sign in on this device, and everything syncs once a connection is available.':'';
}
const renderSoon=()=>{clearTimeout(rT);rT=setTimeout(render,60)};
function join(){clearTimeout(joinT);NET.host=false;if(NET.st!=='offline')NET.st='connecting';status();joinT=setTimeout(claim,300+Math.random()*1500)}
function claim(){
  if(!window.Peer){NET.st='offline';status();return}
  if(NET.hp){try{NET.hp.destroy()}catch(e){}NET.hp=null}
  const p=new Peer(HUB);
  const to=setTimeout(()=>{if(NET.hp!==p){try{p.destroy()}catch(e){}joinT=setTimeout(join,3000)}},10000);
  p.on('open',()=>{clearTimeout(to);NET.hp=p;NET.host=true;NET.hub=null;NET.st='host';status();renderSoon()});
  p.on('connection',c=>{c.on('open',()=>{NET.clients.add(c);status()});c.on('data',d=>onHub(c,d));const x=()=>{NET.clients.delete(c);status()};c.on('close',x);c.on('error',x)});
  p.on('error',e=>{try{p.destroy()}catch(x){}if(NET.hp===p)NET.hp=null;NET.host=false;if(e.type==='unavailable-id')connectHub();else{NET.st='offline';status();joinT=setTimeout(join,8000)}});
  p.on('disconnected',()=>{if(NET.host&&NET.hp===p)try{p.reconnect()}catch(e){}});
}
function mkNp(){const p=new Peer();p.on('error',e=>{if(e.type==='peer-unavailable'){NET.hub=null;join()}});p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});return p}
function connectHub(){
  const np=NET.np&&!NET.np.destroyed?NET.np:(NET.np=mkNp());
  const go=()=>{
    const c=np.connect(HUB,{reliable:true});let ok=false;
    c.on('open',()=>{ok=true;NET.hub=c;NET.st='online';asked={};status();c.send({k:'hub',t:'sync',p:pick(0)})});
    c.on('data',d=>onHub(c,d));

/* ---------- shared relay: encrypted, retained messages so every device sees everything ---------- */
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
const MQ={cl:[],ready:false,ns:'',key:null,seen:{},buf:null};
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mqEnc(o,key=MQ.key){
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(o))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out);

async function mqDec(s,key=MQ.key){const u=unb64(s);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12))))}
MQ.dk={};
const dmKey=async pair=>MQ.dk[pair]||(MQ.dk[pair]=crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',new TextEncoder().encode(COMPANY_CODE+'|dm|'+pair)),'AES-GCM',false,['encrypt','decrypt']));
async function mqPub(sec,id,r,k){

async function mqPubDM(k,m){

  const pair=k.slice(3),[a,b]=pair.split('|');if(!a||!b||!okId(m.id))return;
  const pl=await mqEnc({s:'dm',id:m.id,k,r:m},await dmKey(pair));

function mqPush(p){

  for(const k in p.msgs){const l=p.msgs[k].filter(m=>keep('msg',m.id,m));if(l.length)q.msgs[k]=l}
  if(!isEmpty(q))mqPush(q);
  if(me)for(const k in db.msgs)if(k.startsWith('dm:')&&k.slice(3).split('|').includes(me))for(const m of db.msgs[k])if(keep('dm',m.id,m))mqPubDM(k,m)}
function mqIn(o,pair){
  if(!o||typeof o!=='object'||!o.r||!okId(o.id))return;
  if(o.s==='dm'){
    if(!pair||o.k!=='dm:'+pair)return;
    MQ.dbuf=MQ.dbuf||{};(MQ.dbuf[o.k]=MQ.dbuf[o.k]||[]).push(o.r);
  }else{
    MQ.buf=MQ.buf||{users:{},roles:{},ch:{},fr:{},msgs:{}};
    if(o.s==='msg'){if(typeof o.k!=='string')return;(MQ.buf.msgs[o.k]=MQ.buf.msgs[o.k]||[]).push(o.r)}

async function mqInit(){

async function signIn(name,pw){

  if(pw.length<4)return 'Password must be at least 4 characters.';
  if(!window.crypto||!crypto.subtle)return 'Passwords need a secure (https) page. Open the site over https.';
  const u=getU(name);

  else{

  if(n===me)return v.note=['er','You can’t add yourself.'];
  if(!getU(n))return v.note=['er','No employee “'+n+'” has an account yet.'];
  if(friendsOf(me).includes(n))return v.note=['er','You’re already friends with '+n+'.'];
  if(incOf(me).includes(n)){accept(n);return v.note=['ok','You and '+n+' are now friends.']}

/* ---------- admin tools ---------- */
const cname=s=>{const t=Array.from(s.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_\-\p{Extended_Pictographic}\u200d\ufe0f\u20e3\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}]/gu,'')).slice(0,24).join('');return /[a-z0-9\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}]/u.test(t)?t:''};
function uniq(n){const b=n,all=chans().map(c=>c.name);let i=2;while(all.includes(n))n=b+'-'+i++;return n}
const notice=(title,msg)=>{v.modal={t:'alert',title,msg};render()};
function submitChan(){
  const m=v.modal,n=cname(document.getElementById('chn').value);
  if(!n){document.getElementById('cerr').textContent='Use letters, numbers, dashes, underscores or emojis.';return false}
  if(m.mode==='add'){const id=newId();db.ch[id]={id,name:uniq(n),o:now(),m:now()};v.ch=id;v.t='server'}
  else{const c=db.ch[m.id];if(c&&n!==c.name){c.name=uniq(n);c.m=now()}}
  v.modal=null;changed();return true;
}
async function uploadVid(id,b){if(NET.hub&&NET.hub.open&&b.size<=50*1024*1024)NET.hub.send({k:'hub',t:'putv',id,ty:b.type,buf:await b.arrayBuffer()})}
async function dupChan(id){
  if(!can('chan'))return;const c=chan(id);if(!c)return;const nid=newId(),t=now(),L=[];
  for(const m of msgsOf('official:'+id)){const n={...m,id:newId(),m:t};if(m.v){n.v=newId();try{const b=await getBlob(m.v);if(b){await putBlob(n.v,b);uploadVid(n.v,b)}}catch(e){}}L.push(n)}
  db.ch[nid]={id:nid,name:uniq(c.name+'-copy'),a:c.a,vis:c.vis,post:c.post,slow:c.slow,slowx:c.slowx,nohist:c.nohist,o:t,m:t};db.msgs['official:'+nid]=L;v.ch=nid;v.t='server';changed();render();
}
function delChan(id){
  if(!can('chan'))return;const c=chan(id);if(!c)return;
  v.modal=chans().length<2?{t:'alert',title:'Can’t remove this channel',msg:'The server needs at least one channel.'}
    :{t:'confirm',title:'Remove #'+c.name+'?',msg:'This deletes the channel and all of its messages. It can’t be undone.',btn:'Remove channel',go:'chan',id};
  render();
}
function doDelChan(id){
  (db.msgs['official:'+id]||[]).forEach(m=>{if(m.v)delBlob(m.v).catch(()=>{});tomb(m)});
  db.ch[id].del=1;db.ch[id].m=now();if(v.ch===id)v.ch=chans()[0].id;changed();
}
function doDelMsg(k,id){const m=(db.msgs[k]||[]).find(x=>x.id===id);if(!m||m.del)return;if(m.u!==me&&!(k.startsWith('official:')&&can('delmsg')))return;if(m.v)delBlob(m.v).catch(()=>{});tomb(m);changed()}
function doDelRole(id){const r=db.roles[id];if(r){r.del=1;r.m=now();changed()}}
async function sendVideo(f){
  if(!can('video')||v.t!=='server')return;
  if(!f.type.startsWith('video/'))return notice('Can’t send this file','Choose a video file.');
  if(f.size>50*1024*1024)return notice('Video is too large','Videos are shared directly between devices, so they must be under 50 MB.');
  const id=newId(),cap=document.getElementById('msgin');
  try{await putBlob(id,f)}catch(e){return notice('Video not saved','The video couldn’t be saved. Storage on this device may be full.')}
  (db.msgs[key()]=db.msgs[key()]||[]).push({id:newId(),u:me,t:now(),m:now(),x:cap?cap.value.trim().slice(0,2000):'',v:id,vt:f.type});
  if(cap)cap.value='';vurl[id]=URL.createObjectURL(f);changed();uploadVid(id,f);render();
}
async function delAccount(){
  const n=document.getElementById('delname').value.trim().toLowerCase(),p=document.getElementById('delpw').value,er=document.getElementById('derr'),u=getU(me);
  let ok=false;try{ok=n===me&&p&&await hash(p,u.s)===u.h}catch(e){}
  if(!ok){er.textContent='That username and password don’t match this account.';return}
  const t=now(),gone=[];
  for(const k of Object.keys(db.msgs)){
    if(k.startsWith('dm:')&&k.slice(3).split('|').includes(me)){db.msgs[k].forEach(m=>m.v&&gone.push(m.v));delete db.msgs[k]}
    else for(const m of db.msgs[k])if(m.u===me&&!m.del){if(m.v)gone.push(m.v);tomb(m)}
  }
  for(const f of Object.values(db.fr))if(!f.del&&(f.a===me||f.b===me)){f.del=1;f.m=t}
  db.users[me]={del:1,m:t};save();push();v.modal=null;signOut();
  gone.forEach(id=>delBlob(id).catch(()=>{}));
}

  const b=document.querySelector('[data-a=login]'),er=document.getElementById('lerr');

  if(msg){er.textContent=msg;b.disabled=false}
}

  else if(a==='mclose')v.modal=null;
  else if(a==='del1'||a==='del2')v.modal={t:a};
  else if(a==='roles'&&isAdmin())v.modal={t:'roles'};

  else if(a==='pfrole'&&can('assign')){const t=db.users[n],r=b.dataset.r,cur=Array.isArray(t.roles)?t.roles:[];t.roles=cur.includes(r)?cur.filter(x=>x!==r):[...cur,r];t.m=now();changed()}
  else if(a==='rnew'&&isAdmin()){const nm=document.getElementById('rname').value.trim().slice(0,24);if(!nm)return;const id='r'+newId();db.roles[id]={id,name:nm,color:document.getElementById('rcolor').value,m:now()};changed()}
  else if(a==='chadd'&&mcan())v.modal={t:'chname',mode:'add'};
  else if(a==='chren'&&mcan()&&chan(n))v.modal={t:'chname',mode:'ren',id:n};
  else if(a==='chann'&&mcan()&&db.ch[n]){const c=db.ch[n];if(c.a)delete c.a;else c.a=1;c.m=now();changed()}
  else if(a==='chslow'&&mcan()&&db.ch[n]){const c=db.ch[n],q=+b.dataset.s;if(SLOWS.some(x=>x[0]===q)){if(q)c.slow=q;else delete c.slow;c.m=now();changed()}}
  else if(['chvis','chpost','chslowx','chnohist'].includes(a)&&mcan()&&db.ch[n]){const c=db.ch[n],f=({chvis:'vis',chpost:'post',chslowx:'slowx',chnohist:'nohist'})[a],r=b.dataset.r,cur=Array.isArray(c[f])?c[f]:[];c[f]=cur.includes(r)?cur.filter(x=>x!==r):[...cur,r];c.m=now();changed()}
  else if(a==='rperm'&&isAdmin()){const r=db.roles[b.dataset.r],k=b.dataset.p;if(r&&PERMS.some(x=>x[0]===k)){r.p=r.p&&typeof r.p==='object'?{...r.p}:{};r.p[k]=!r.p[k];r.m=now();changed()}}
  else if(a==='chgo'&&mcan()){if(!submitChan())return}
  else if(a==='cfgo'){const m=v.modal;v.modal=null;if(m&&m.go==='msg')doDelMsg(m.k,m.id);else if(m&&m.go==='chan'&&mcan())doDelChan(m.id);else if(m&&m.go==='role'&&isAdmin())doDelRole(m.id)}
  else if(a==='mesave'){
    const m0=v.modal,m=(db.msgs[m0.k]||[]).find(x=>x.id===m0.id),t=document.getElementById('medit').value.trim().slice(0,2000);
    if(!m||m.del||m.u!==me)v.modal=null;
    else if(!t&&!m.v){document.getElementById('cerr').textContent='A message can’t be empty. Delete it instead.';return}
    else{if(t!==m.x){m.x=t;m.ed=now();m.m=now();changed()}v.modal=null}
  }
  else return;
  render();
});
root.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.closest('form');if(!f)return;
  if(f.dataset.a==='send'){const i=document.getElementById('msgin');if(send(i.value))i.value='';render()}
  else if(f.dataset.a==='addf'){addFriend(document.getElementById('friendin').value);render()}
});
root.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id==='vidin'){sendVideo(f);e.target.value='';return}
  if(e.target.id==='picin'&&f.type.startsWith('image/')){
    const img=new Image(),url=URL.createObjectURL(f);
    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const z=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-z)/2,(img.height-z)/2,z,z,0,0,128,128);U().pic=c.toDataURL('image/jpeg',.85);U().m=now();URL.revokeObjectURL(url);changed();render()};
    img.src=url;
  }
});
root.addEventListener('touchstart',e=>{
  const b=e.target.closest('[data-a=ch]');if(!b||!can('chan'))return;
  const t=e.touches[0];lpFired=false;
  lp=setTimeout(()=>{lpFired=true;v.ctx={id:b.dataset.n,x:t.clientX,y:t.clientY};render()},550);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>root.addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
root.addEventListener('contextmenu',e=>{
  const b=e.target.closest('[data-a=ch]');if(!b||!can('chan'))return;
  e.preventDefault();v.ctx={id:b.dataset.n,x:e.clientX,y:e.clientY};render();
});
root.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(v.modal||v.ctx)){v.modal=null;v.ctx=null;render();return}
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  const id=e.target.id;
  if(id==='uname'){e.preventDefault();document.getElementById('pw').focus()}
  else if(id==='pw'){e.preventDefault();doLogin()}
  else if(id==='delname'){e.preventDefault();document.getElementById('delpw').focus()}
  else if(id==='delpw'){e.preventDefault();delAccount()}
  else if(id==='medit'){e.preventDefault();document.querySelector('[data-a=mesave]').click()}
  else if(id==='chn'){e.preventDefault();document.querySelector('[data-a=chgo]').click()}
  else if(id==='rname'){e.preventDefault();document.querySelector('[data-a=rnew]').click()}
  else if(id==='msgin'){e.preventDefault();if(send(e.target.value))e.target.value='';render()}
  else if(id==='friendin'){e.preventDefault();addFriend(e.target.value);render()}
});

/* ---------- start ---------- */
if(me&&!getU(me))me=null;
render();
if(window.Peer){join();if(me)startSelf()}else{NET.st='offline';status()}
mqInit().catch(()=>{});
setTimeout(()=>{if(NET.st==='connecting'&&!MQ.cl.some(c=>c.connected)){NET.st='offline';status()}},12000);
setInterval(dmTick,6000);
setInterval(()=>{const el=document.getElementById('slowbar');if(el&&me&&v.t==='server'){const c=chan(v.ch);if(c)el.textContent=slowText(c)}},1000);
const wake=()=>{
  if(document.visibilityState==='hidden'||!window.Peer)return;
  if(NET.host){if(!NET.hp||NET.hp.destroyed)join();else if(NET.hp.disconnected)try{NET.hp.reconnect()}catch(e){}}
  else if(!(NET.hub&&NET.hub.open))join();
  if(me){if(!NET.sp||NET.sp.destroyed)startSelf();else if(NET.sp.disconnected)try{NET.sp.reconnect()}catch(e){}}
};
document.addEventListener('visibilitychange',wake);window.addEventListener('online',wake);window.addEventListener('pageshow',wake);
window.addEventListener('beforeunload',()=>{try{NET.hp&&NET.hp.destroy();NET.sp&&NET.sp.destroy()}catch(e){}});
</script>
